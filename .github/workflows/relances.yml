name: Relances factures en retard

on:
  schedule:
    - cron: '0 8 * * *'   # Tous les jours à 8h00 UTC (10h heure belge)
  workflow_dispatch:       # Déclenchement manuel depuis GitHub Actions

jobs:
  relancer:
    runs-on: ubuntu-latest
    steps:
      - name: Appel Edge Function relances-factures
        run: |
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://mycxcxxrbwvvagfcryfg.supabase.co/functions/v1/relances-factures)

          echo "HTTP status: $HTTP_CODE"
          cat response.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Erreur : réponse HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Relances exécutées avec succès"
