name: Relances factures en retard

on:
  schedule:
    - cron: '0 8 * * *'   # Tous les jours à 8h00 UTC (10h heure belge)
  workflow_dispatch:       # Permet de déclencher manuellement depuis GitHub

jobs:
  relancer:
    runs-on: ubuntu-latest
    steps:
      - name: Appel Edge Function relances-factures
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://mycxcxxrbwvvagfcryfg.supabase.co/functions/v1/relances-factures
